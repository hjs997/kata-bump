
name: Katabump Auto Renew

on:
  schedule:
    - cron: '30 22 */1 * *'  # 每月 1、6、11、16、21、26、31 日 UTC 22:30（北京时间次日 06:30）
  workflow_dispatch:

# 防止同一个工作流并发运行
concurrency:
  group: katabump-auto-renew-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和python依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python3 app.py

      # 更新时间到 time.txt，避免 90 天未更新导致工作流暂停
      - name: 🕒 更新运行时间
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 写入北京时间
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt

          git add time.txt

          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"

            # 最多尝试推送 3 次
            success=0

            for i in 1 2 3; do
              echo "Push attempt $i/3"

              # 获取远程最新提交
              git fetch origin main

              # 同步远程更新，保留本地提交
              if ! git rebase origin/main; then
                echo "Rebase conflict detected"
                git rebase --abort || true
                exit 1
              fi

              # 推送到远程
              if git push origin HEAD:main; then
                echo "Push successful"
                success=1
                break
              fi

              echo "Push failed, retrying..."

              if [ "$i" -lt 3 ]; then
                sleep 3
              fi
            done

            if [ "$success" -ne 1 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')

          count=0

          for run_id in $runs; do
            count=$((count + 1))

            if [ "$count" -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete "$run_id" || true
            fi
          done
